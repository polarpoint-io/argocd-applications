# AgentHive - shared, reviewed memory graph for a team of coding agents.
#
# Chart: git@github.com:polarpoint-io/agenthive.git // helm/agenthive
# Declared in argocd-core as agenthive-non-prod.
#
# SQLite + single replica: this is a small internal tool, not a
# multi-tenant service, and the chart itself refuses more than one
# replica against SQLite (see the chart's own _helpers.tpl guardrail).
# Move to database.type=postgres here (plus a real DATABASE_URL secret)
# if that ever stops being true.

fullnameOverride: agenthive

# Chart.yaml's appVersion is stuck at "1.0.0" as of v1.6.0 (a
# semantic-release-helm3 misconfiguration, fixed in agenthive's
# .releaserc.json going forward but not retroactively - see that repo's
# 6d8abd2). Pin the main image tag explicitly rather than rely on the
# chart's `.Values.image.tag | default .Chart.AppVersion` fallback,
# which right now would resolve to the old, already-fixed-once
# non-numeric-USER v1.0.0 image. Safe to drop once a release publishes a
# correct appVersion again. (ui.image.tag gets the same pin further down,
# next to the rest of the ui.* block.)
image:
  tag: "1.6.0"

sqlite:
  persistence:
    size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------
# Personal tokens only for now. Flip this on once there's a real Azure AD
# App Registration for AgentHive - tenantId/clientId are not secret and can
# move inline here; clientSecret stays in ESO like every other credential
# in this repo (see the externalSecrets block on the Application in
# argocd-core, once this is turned on).
auth:
  azureAd:
    enabled: false
    # tenantId: ...
    # clientId: ...
    # existingSecret: agenthive-azure-ad
    # redirectUri: https://hive.polarpoint.io/auth/azure/callback

# ---------------------------------------------------------------------------
# Exposure
# ---------------------------------------------------------------------------
# No Ingress in this org - hive.polarpoint.io is served by the nginx
# TLS proxy from helm-library-manifests, carried on this Application as an
# extraSource (see argocd-core), with tailscale doing the L4 and
# cert-manager the certificate - same pattern as mirofish/toolhive-cloud-ui.
ingress:
  enabled: false

networkPolicy:
  enabled: false

# ---------------------------------------------------------------------------
# Standalone review UI
# ---------------------------------------------------------------------------
# Split out to its own container (see agenthive's ui/Dockerfile /
# README.md's "Splitting the review UI into its own container") rather
# than the app's built-in /ui, same reasoning as the "no Ingress" comment
# above - exposed at hive-ui.polarpoint.io via its own tlsProxy entry
# (see argocd-core's agenthive-non-prod extraSources). publicUrl/apiUrl
# below are what make Azure AD sign-in and the API's CORS_ORIGIN line up
# once auth.azureAd.enabled is turned on above.
ui:
  enabled: true
  # Same appVersion caveat as the top-level image.tag above.
  image:
    tag: "1.6.0"
  ingress:
    enabled: false
  apiUrl: https://hive.polarpoint.io
  publicUrl: https://hive-ui.polarpoint.io
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
