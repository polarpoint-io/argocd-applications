apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmesgpt-runbook-mcp-secrets
  namespace: holmesgpt
spec:
  refreshInterval: 1h
  secretStoreRef: {name: {{ .Values.secretStore }}, kind: ClusterSecretStore}
  target: {name: holmesgpt-runbook-mcp-secrets}
  data:
    - secretKey: llm-api-key
      remoteRef: {key: holmesgpt-runbook-mcp, property: llm-api-key}
    - secretKey: git-token
      remoteRef: {key: holmesgpt-runbook-mcp, property: git-token}
    - secretKey: confluence-url
      remoteRef: {key: holmesgpt-runbook-mcp, property: confluence-url}
    - secretKey: confluence-username
      remoteRef: {key: holmesgpt-runbook-mcp, property: confluence-username}
    - secretKey: confluence-api-token
      remoteRef: {key: holmesgpt-runbook-mcp, property: confluence-api-token}
