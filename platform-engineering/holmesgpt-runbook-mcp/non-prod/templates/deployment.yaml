apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmesgpt-runbook-mcp
  namespace: holmesgpt
  labels:
    app: holmesgpt-runbook-mcp
    app.kubernetes.io/name: holmesgpt-runbook-mcp
    app.kubernetes.io/part-of: holmesgpt
spec:
  replicas: 1
  selector:
    matchLabels: {app: holmesgpt-runbook-mcp}
  template:
    metadata:
      labels: {app: holmesgpt-runbook-mcp}
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: holmesgpt-runbook-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp-server
          image: {{ .Values.image }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LLM_PROVIDER
              value: {{ .Values.llmProvider | quote }}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: holmesgpt-runbook-mcp-secrets, key: llm-api-key}}

            - name: GIT_PROVIDER
              value: {{ .Values.gitProvider | quote }}
            - name: GIT_TOKEN
              valueFrom: {secretKeyRef: {name: holmesgpt-runbook-mcp-secrets, key: git-token}}
            - name: GIT_RUNBOOK_REPO
              value: {{ .Values.gitRunbookRepo | quote }}
            - name: GIT_BASE_BRANCH
              value: {{ .Values.gitBaseBranch | quote }}

            - name: CONFLUENCE_URL
              valueFrom: {secretKeyRef: {name: holmesgpt-runbook-mcp-secrets, key: confluence-url}}
            - name: CONFLUENCE_USERNAME
              valueFrom: {secretKeyRef: {name: holmesgpt-runbook-mcp-secrets, key: confluence-username}}
            - name: CONFLUENCE_API_TOKEN
              valueFrom: {secretKeyRef: {name: holmesgpt-runbook-mcp-secrets, key: confluence-api-token}}
            - name: CONFLUENCE_RUNBOOK_SPACE
              value: {{ .Values.confluenceRunbookSpace | quote }}

            - name: RUNBOOK_PATH_PREFIX
              value: {{ .Values.runbookPathPrefix | quote }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      restartPolicy: Always
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: holmesgpt-runbook-mcp
  namespace: holmesgpt
