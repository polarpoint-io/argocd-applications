{{/*
Only the controller cluster runs ArgoCD, so only it needs a server certificate.
Gated on argocdHost rather than living in a separate copy of this chart - the
three per-cluster copies differed by exactly this file and this one value.
*/}}
{{- if .Values.argocdHost }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-tls
  namespace: argocd
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.argocdHost }}
{{- end }}
