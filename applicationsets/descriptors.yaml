# One ApplicationSet in place of the six parent Applications that used to render
# child Application specs from Helm templates.
#
# Why this replaces the parent/child pattern:
#
# A parent was an Application whose *rendered output* was more Application specs.
# That meant every change took two syncs - the parent to regenerate the child, then
# the child to deploy - and a promotion that pushed a new targetRevision looked
# flaky because the child lagged a sync behind the push. An ApplicationSet has no
# such gap: the controller watches the repo and reconciles the generated
# Applications directly.
#
# Shape: a matrix of (project, env, destination) x (every descriptor file for that
# project/env). The list half is the part a human edits - adding a cluster or an
# environment is one entry here, not a new parent Application in argocd-core plus a
# new global-values file in a separate repo.
#
# The destination is keyed on the PAIR, deliberately. `non-prod` does not mean one
# cluster: foundational/non-prod is the controller cluster while tooling/non-prod is
# 192.168.11.80. Keying destination on env alone would silently relocate twelve
# applications.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: descriptors
  namespace: argocd
spec:
  # Keeps today's deletion semantics. The ApplicationSet controller adds
  # `resources-finalizer.argocd.argoproj.io` to every Application it generates
  # unless this is set; none of the Applications the parents produced ever carried
  # one. Without this, removing a descriptor stops meaning "orphan the workload"
  # and starts meaning "delete the workload and everything it deployed" - and
  # `prune: false` does not protect against it, because the deletion comes from the
  # finalizer rather than from a sync.
  #
  # Found the hard way: a throwaway ApplicationSet used to verify this migration
  # generated 40 Applications pointed at the same live resources as the real ones,
  # each with that finalizer attached. Deleting it would have cascaded into
  # cert-manager, tailscale-operator, kargo and ciso-assistant across three
  # clusters. Turn cascade on deliberately later if it is wanted; do not inherit it
  # by accident.
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  # Required fields fail loudly rather than rendering empty. A dropped
  # targetRevision once left every git-sourced app silently tracking HEAD; an
  # empty string is the failure mode worth being noisy about. Optional fields are
  # guarded with hasKey in templatePatch so they do not trip this.
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # --- foundational: the per-cluster baseline, one entry per cluster
                - project: foundational
                  env: non-prod
                  destination: https://kubernetes.default.svc
                - project: foundational
                  env: non-prod-tooling
                  destination: https://192.168.11.80:6443
                - project: foundational
                  env: non-prod-multitenant
                  destination: https://192.168.11.63:6443
                # --- controller: cluster-management workloads, controller cluster only
                - project: controller
                  env: non-prod
                  destination: https://kubernetes.default.svc
                # --- tooling: general workloads. Note non-prod here is the tooling
                #     cluster, not the controller cluster - see the comment above.
                - project: tooling
                  env: non-prod
                  destination: https://192.168.11.80:6443
                - project: tooling
                  env: non-prod-multitenant
                  destination: https://192.168.11.63:6443
                # --- tooling/prod: add when the ciso prod RKE2 cluster exists. The
                #     descriptor (apps/tooling/ciso-assistant/prod.yaml) is already
                #     written and has never rendered, because nothing globbed prod.yaml.
                #     Uncommenting this and registering the cluster is the whole change.
                # - project: tooling
                #   env: prod
                #   destination: https://<ciso-prod-api>:6443
          - git:
              repoURL: git@github.com:polarpoint-io/argocd-applications.git
              revision: main
              # Single-level glob, not `**`. Descriptors live exactly one directory
              # deep; `**` would also match env-named files inside the vendored chart
              # directories that sit beside them.
              files:
                - path: "apps/{{ .project }}/*/{{ .env }}.yaml"

  # The invariant shape. Anything that varies in *structure* rather than value has
  # to go in templatePatch below, because this block is a typed Application spec -
  # it cannot grow conditional keys or a map with descriptor-supplied label names.
  template:
    metadata:
      name: "{{ .chart.name }}-{{ .env }}"
      namespace: argocd
      labels:
        env: "{{ .env }}"
        app: "{{ .chart.name }}"
    spec:
      project: "{{ .project }}"
      source:
        repoURL: "{{ .chart.url }}"
      destination:
        server: "{{ .destination }}"
        namespace: "{{ .chart.namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true

  # Merge-patched over the rendered Application. This is where the descriptor's own
  # optional fields land, and the only place conditionals are possible.
  #
  # Descriptor labels are applied here, i.e. after the env/app labels above, so they
  # still win - which is how the old Helm template behaved. ciso-assistant-manifests
  # sets app=ciso-assistant and relies on overriding the generated app= value.
  # Reordering this renames labels on live objects.
  templatePatch: |
    metadata:
      labels:
        {{- range $k, $v := .labels }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- if hasKey . "annotations" }}
      annotations:
        {{- range $k, $v := .annotations }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- end }}
    spec:
      source:
        {{- if hasKey .chart "path" }}
        path: "{{ .chart.path }}"
        # Emitted for path-mode too. It used to be dropped here, so every
        # git-sourced app silently tracked HEAD of the default branch. That stopped
        # being survivable the moment several apps began sharing one chart.
        targetRevision: "{{ dig "targetRevision" "main" .chart }}"
        {{- else }}
        chart: "{{ .chart.name }}"
        targetRevision: "{{ .chart.targetRevision }}"
        {{- end }}
        {{- if hasKey . "values" }}
        helm:
          values: |{{ nindent 12 .values }}
        {{- end }}
      {{- if hasKey . "ignoreDifferences" }}
      # For fields a controller legitimately owns after ArgoCD creates them.
      # Without this the app sits OutOfSync forever and real drift gets lost in the
      # noise - which defeats the point of watching sync status at all.
      ignoreDifferences:
        {{- toYaml .ignoreDifferences | nindent 4 }}
      {{- end }}
