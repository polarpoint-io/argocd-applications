# Falco - runtime threat detection, one DaemonSet per node.
#
# modern_ebpf needs no kernel headers and no compiled driver, which matters on
# RKE2 where the alternative is building a module per node and rebuilding it on
# every kernel bump. Requires kernel >= 5.8; these nodes are well past that.
# auto, not modern_ebpf. The estate is mixed: controller and tooling are all on
# kernel 6.8, but multitenant still has two Ubuntu 20.04 nodes on 5.4 left from
# the RKE1 lineage. modern_ebpf needs the BPF ring buffer, which landed in 5.8,
# so on those two the pod came up and then died with
# "libpman: ring buffer map type is not supported (errno 22)".
#
# auto probes what each node can actually run - modern_ebpf where the kernel
# allows, falling back to the legacy probe - so one DaemonSet covers a fleet that
# is midway through a kernel upgrade. Worth revisiting once nothing is on 5.4.
driver:
  enabled: true
  kind: auto

# Falcosidekick is what turns a detection into something anyone sees. Left off
# until there is somewhere to send events - a webhook with no destination is
# worse than nothing, because it looks configured.
falcosidekick:
  enabled: false

collectors:
  # RKE2 uses containerd, not docker.
  docker:
    enabled: false
  containerd:
    enabled: true
    socket: /run/k3s/containerd/containerd.sock

falco:
  # Plain-text output is unreadable in aggregate; JSON is what a log pipeline can
  # actually parse once Alloy is shipping.
  json_output: true
  json_include_output_property: true
  log_level: info

# Falco is a per-node agent - it has to tolerate control-plane nodes too, or it
# silently monitors only the workers.
tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists
