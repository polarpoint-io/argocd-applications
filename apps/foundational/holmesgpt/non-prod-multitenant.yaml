chart:
  name: holmes
  url: https://robusta-charts.storage.googleapis.com
  targetRevision: 0.38.1
  namespace: holmesgpt

labels:
  service: platform
  app: holmesgpt

values: |
  # HolmesGPT / CNCF SRE Agent - standalone Robusta 'holmes' chart (not the
  # full robusta umbrella chart, which pulls in Slack/alerting we don't need).
  # Pure HTTP API, no built-in web UI - use the CLI/TUI or hit the API
  # directly from inside the cluster:
  # http://holmes-non-prod-multitenant-holmes.holmesgpt.svc:80
  #
  # LLM key is NOT stored here. It's seeded imperatively as a k8s Secret
  # (holmes-llm-keys, key ANTHROPIC_API_KEY) directly on the multitenant
  # cluster in the holmesgpt namespace - not tracked in git:
  #   kubectl create secret generic holmes-llm-keys \
  #     --from-literal=ANTHROPIC_API_KEY=<key> -n holmesgpt
  extraEnvVarsSecrets:
    - holmes-llm-keys

  modelList:
    claude-sonnet-5:
      model: anthropic/claude-sonnet-5
      api_key: envRef:ANTHROPIC_API_KEY

  # holmesgpt-runbook-mcp (github.com/polarpoint-io/holmesgpt-runbook-mcp) -
  # deployed alongside Holmes in the same namespace, see the
  # holmesgpt-runbook-mcp Application. Adds runbook_search, runbook_get,
  # investigation_classify, runbook_draft and root_cause_analyse - all
  # gated by platform-agent-stack's risk-tiers.yaml where that's deployed.
  mcp_servers:
    runbook_mcp:
      description: "Runbook search, gap detection, drafting, and root cause analysis via Confluence"
      config:
        url: "http://holmesgpt-runbook-mcp.holmesgpt.svc.cluster.local:8080/mcp"
        mode: streamable-http

  # Default toolsets (kubernetes/core, logs, robusta, internet, prometheus,
  # skills, connectivity_check, bash) and default k8sRBAC:false (chart's own
  # broad read-only ClusterRole + CRD permissions for argo/flux/etc.) are
  # left at chart defaults - appropriate for a read-only investigation agent.
