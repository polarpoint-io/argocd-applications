# Kargo Project - cluster-scoped, reconciling this creates/owns a namespace of
# the same name where the Warehouse/Stage/ProjectConfig/git-creds below live.
# Deliberately NOT named "ciso-assistant" - that namespace already holds the
# running app itself; the promotion pipeline gets its own namespace.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: ciso-assistant-promotion
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Auto-promotion for both stages - non-prod picks up new chart versions from
# the Warehouse automatically, prod auto-promotes whatever non-prod verifies.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: ciso-assistant-promotion
  namespace: ciso-assistant-promotion
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  promotionPolicies:
    - stageSelector:
        name: non-prod
      autoPromotionEnabled: true
    - stageSelector:
        name: prod
      autoPromotionEnabled: true
