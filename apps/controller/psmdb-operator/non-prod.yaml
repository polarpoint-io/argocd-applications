chart:
  name: psmdb-operator
  url: https://percona.github.io/percona-helm-charts/
  targetRevision: 1.23.0
  namespace: psmdb-operator

labels:
  service: controller
  app: psmdb-operator

# Watches for PerconaServerMongoDB CRs cluster-wide by default. Needed by
# mongostate-crossplane's baremetal Composition (manifests/composition-
# baremetal.yaml), which is what actually creates the PerconaServerMongoDB
# resource per MongoState claim. Sync psmdb-operator-crds first.
values: |
  watchAllNamespaces: true
