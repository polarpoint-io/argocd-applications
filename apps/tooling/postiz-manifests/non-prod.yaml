# The manifests Postiz needs alongside its vendored chart, as values for the
# shared helm-library-manifests chart.
#
# Second consumer after ciso-assistant. Same shape: two ExternalSecrets, a
# Certificate, and the nginx TLS-proxy trio. Verified equivalent before
# switching - the library renders the same six objects with byte-identical
# nginx (19 directives), including NOT setting X-Forwarded-Host, which this
# proxy never did.
chart:
  name: postiz-manifests
  path: .
  url: git@github.com:polarpoint-io/helm-library-manifests.git
  targetRevision: v2.1.0
  namespace: postiz

labels:
  service: tooling
  app: postiz

values: |
  global:
    secretStore: {name: cluster-secrets-store, kind: ClusterSecretStore}
    issuer: letsencrypt-dns01

  externalSecrets:
    - secretName: postiz-db
      namespace: postiz
      refreshInterval: 5m
      data:
        - {secretKey: postgres-password, remoteRef: {key: postiz, property: db-password}}
        - {secretKey: password, remoteRef: {key: postiz, property: db-password}}
    - secretName: postiz-secrets
      namespace: postiz
      refreshInterval: 5m
      data:
        - {secretKey: JWT_SECRET, remoteRef: {key: postiz, property: jwt-secret}}
        - {secretKey: DATABASE_URL, remoteRef: {key: postiz, property: database-url}}
        - {secretKey: REDIS_URL, remoteRef: {key: postiz, property: redis-url}}
        - {secretKey: LINKEDIN_CLIENT_ID, remoteRef: {key: postiz, property: linkedin-client-id}}
        - {secretKey: LINKEDIN_CLIENT_SECRET, remoteRef: {key: postiz, property: linkedin-client-secret}}
        - {secretKey: YOUTUBE_CLIENT_ID, remoteRef: {key: postiz, property: youtube-client-id}}
        - {secretKey: YOUTUBE_CLIENT_SECRET, remoteRef: {key: postiz, property: youtube-client-secret}}

  certificates:
    - name: postiz-tls
      namespace: postiz
      host: schedule.polarpoint.io

  tlsProxies:
    - name: schedule
      namespace: postiz
      host: schedule.polarpoint.io
      certSecret: postiz-tls
      maxBodySize: "100m"
      routes:
        - {path: "/", upstream: "http://postiz:80", websocket: true, forwardedHost: false}
