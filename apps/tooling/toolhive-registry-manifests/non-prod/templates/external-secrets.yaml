apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-registry-db
  namespace: toolhive-system
spec:
  refreshInterval: 5m
  secretStoreRef: {name: {{ .Values.secretStore }}, kind: ClusterSecretStore}
  target: {name: toolhive-registry-db}
  data:
    - secretKey: postgres-password
      remoteRef: {key: toolhive-registry, property: db-password}
    - secretKey: password
      remoteRef: {key: toolhive-registry, property: db-password}
