chart:
  name: toolhive-registry-server
  url: ghcr.io/stacklok
  targetRevision: "1.5.0"
  namespace: toolhive-system

labels:
  service: tooling
  app: toolhive-registry

values: |
  fullnameOverride: toolhive-registry

  config:
    sources:
      - name: toolhive
        git:
          repository: https://github.com/stacklok/toolhive-catalog.git
          branch: main
          path: pkg/catalog/toolhive/data/registry-upstream.json
        syncPolicy:
          interval: "30m"
    registries:
      - name: default
        sources: ["toolhive"]
    auth:
      mode: anonymous
    database:
      host: toolhive-registry-postgres
      port: 5432
      user: thv_user
      database: toolhive_registry
      sslMode: disable   # cluster-internal only; bitnami postgresql has no TLS listener configured

  extraEnv:
    - name: THV_REGISTRY_DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: toolhive-registry-db
          key: password

  # Plain ClusterIP, internal only - see toolhive-registry-manifests for the
  # TLS proxy + tailscale expose (registry server itself speaks HTTP only).
  service:
    type: ClusterIP
    port: 8080
